name: Auto Sync 天神接口（iy.zip）& Build Merged Interface

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时运行一次
  workflow_dispatch:         # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      # 清理旧目录
      - name: Clean old extracted folders
        run: |
          ZIP_NAME="缘起【天神IY】.zip"
          FOLDER_NAME="缘起【天神IY】"
          rm -rf "$ZIP_NAME" "$FOLDER_NAME" || true

      # 下载 zip (从 GitHub 仓库下载)
      - name: Download zip
        run: |
          ZIP_NAME="缘起【天神IY】.zip"
          # 注意：GitHub 的 raw 地址格式如下
          URL="https://raw.githubusercontent.com/IY-CPU/IY/main/$ZIP_NAME"
          
          curl -f -L --retry 5 --retry-delay 2 --max-time 60 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -o "$ZIP_NAME" "$URL" || {
              echo "❌ $ZIP_NAME 下载失败，尝试检查分支名是否为 main 或文件是否存在"
              exit 1
            }
          
          if [ ! -s "$ZIP_NAME" ]; then
            echo "❌ $ZIP_NAME 文件为空"
            exit 1
          fi

      # 解压
      - name: Unzip to folder
        run: |
          ZIP_NAME="缘起【天神IY】.zip"
          FOLDER_NAME="缘起【天神IY】"
          mkdir -p "$FOLDER_NAME"
          unzip -o "$ZIP_NAME" -d "$FOLDER_NAME"

      # 运行原始提取脚本
      - name: Extract JSON
        run: node extract.js || exit 1

      # --- 新增步骤：修改 lib 目录前缀 ---
      # 使用 sed 替换 天神IY.txt 中的地址
      # 逻辑：查找包含 /lib/ 的路径，并将其前缀统一替换为 https://ghfast.top/https://github.com/IY-CPU/IY/raw/main/lib/
      - name: Fix lib paths
        run: |
          if [ -f "天神IY.txt" ]; then
            echo "正在优化 lib 路径..."
            # 这里的正则匹配会寻找所有包含 ./lib/ 或旧域名的路径，统一替换为你的新目标地址
            # 如果你的 extract.js 生成的是相对路径 ./lib/，则用下面这行：
            sed -i 's|\./lib/|https://ghfast.top/https://github.com/IY-CPU/IY/raw/main/lib/|g' 天神IY.txt
            # 如果生成的是带旧域名的绝对路径，请根据实际情况调整上面的 's|旧|新|g'
          fi

      # 合并补丁
      - name: Merge JSON
        run: node merge.js || exit 1

      # 检查是否有变化
      - name: Check for changes
        id: changes
        run: |
          git add .
          if git diff --quiet HEAD; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # 推送到 GitHub
      - name: Commit and push to GitHub
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-sync from IY-CPU/IY & fix lib paths"
          git push
